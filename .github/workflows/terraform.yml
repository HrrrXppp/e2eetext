name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.5"

jobs:
  fmt-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform

      - name: terraform init (no backend)
        working-directory: terraform/envs/shared
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: terraform/envs/shared
        run: terraform validate

  # Plan-only — never apply in CI given the blast radius (a shared,
  # account-wide ECR/IAM stack). This job needs the AWS_ROLE_ARN /
  # AWS_REGION secrets already used by build-images.yml, plus that role
  # (or a wider one) having read access to IAM/ECR/S3 state — the current
  # github-actions-ecr-push role is scoped to ECR push only (see
  # terraform/modules/github-oidc), so this step will fail with
  # AccessDenied until it's granted read access or a separate read-only
  # "terraform-plan" role is provisioned. Skips cleanly (rather than
  # failing the required checks above) when the secrets aren't set.
  plan:
    needs: fmt-and-validate
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check AWS secrets are configured
        id: secrets-check
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ] && [ -n "${{ secrets.AWS_REGION }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.secrets-check.outputs.configured == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: terraform init
        if: steps.secrets-check.outputs.configured == 'true'
        working-directory: terraform/envs/shared
        run: terraform init -input=false

      - name: terraform plan
        if: steps.secrets-check.outputs.configured == 'true'
        working-directory: terraform/envs/shared
        run: terraform plan -input=false -lock-timeout=60s
