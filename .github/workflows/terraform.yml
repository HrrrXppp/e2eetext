name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.5"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform

  # Phase 2 of #27 added terraform/envs/{dev,prod} alongside envs/shared —
  # matrixed so every root config gets init+validate on PRs touching
  # terraform/. `terraform validate` doesn't need variable values (prod's
  # ami_id/instance_type/alb_security_group_id/acm_certificate_arn are
  # required with no defaults, by design, until its live status is
  # confirmed; dev's defaults are audited-live values — see
  # terraform/envs/dev/variables.tf), so this needs no secrets/tfvars to
  # run.
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [shared, dev, prod]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (no backend)
        working-directory: terraform/envs/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: terraform/envs/${{ matrix.environment }}
        run: terraform validate

  # Plan-only — never apply in CI given the blast radius (a shared,
  # account-wide ECR/IAM stack). Deliberately does NOT reuse the
  # AWS_ROLE_ARN secret build-images.yml assumes: that role is scoped to
  # ECR push only (see terraform/modules/github-oidc) and lacks the
  # IAM/ECR/S3 read access `terraform plan` needs, so reusing it would just
  # trade one AccessDenied failure mode for another. Instead this job looks
  # for a separate AWS_TERRAFORM_PLAN_ROLE_ARN secret pointing at a
  # dedicated, read-only "terraform-plan" role — until that's provisioned,
  # the job skips cleanly rather than failing (or erroring red) on every
  # Terraform PR. `continue-on-error` on the AWS-touching steps is a second
  # safety net so a misconfigured/under-scoped plan role degrades this
  # optional job to a warning instead of a hard failure.
  #
  # Gated behind the "terraform-plan" GitHub Environment (must be created in
  # repo Settings > Environments, ideally with required reviewers) so that,
  # once this job has real AWS credentials, a same-repo PR can't use edits
  # to this workflow file to run arbitrary steps with those OIDC-derived
  # credentials before anyone reviews it.
  #
  # Matrixed over shared/dev/prod like the validate job above. dev's
  # network/ec2/alb variables still default to audited-live values (Phase
  # 2), and it looks the ALB SG / ACM cert up from the live ALB by name
  # (which is why its plan needs real AWS credentials) — but Phase 3's RDS
  # variables (rds_identifier, rds_engine_version, rds_instance_class, ...
  # see terraform/envs/dev/terraform.tfvars.example) have no defaults at
  # all, since Phase 3 was implemented without AWS credentials to audit the
  # live dev RDS instance. So dev now needs DEV_TFVARS supplied too, the
  # same way prod always has: prod's required-with-no-default variables
  # (ami_id, instance_type, alb_security_group_id, acm_certificate_arn,
  # plus the same rds_* set — see
  # terraform/envs/prod/terraform.tfvars.example) are intentionally NOT
  # hardcoded here or given fallback defaults in the .tf files while prod's
  # live status is unconfirmed (a wrong guess for an import target risks a
  # forced replace on live resources — the same lesson Phase 1 learned the
  # hard way with the OIDC role name/thumbprint). Both are read from
  # optional DEV_TFVARS / PROD_TFVARS secrets (full .tfvars-file contents)
  # written to a gitignored ci.auto.tfvars before plan runs. Until the
  # relevant secret is populated (which for dev's rds_* values requires
  # first auditing the live dev RDS instance — see README's Terraform
  # section), that environment's plan step degrades to a skipped no-op via
  # the same "not configured yet" pattern already used for
  # AWS_TERRAFORM_PLAN_ROLE_ARN, rather than failing the workflow.
  plan:
    needs: [fmt, validate]
    runs-on: ubuntu-latest
    environment: terraform-plan
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        environment: [shared, dev, prod]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check AWS secrets are configured
        id: secrets-check
        run: |
          if [ -n "${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}" ] && [ -n "${{ secrets.AWS_REGION }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.secrets-check.outputs.configured == 'true'
        continue-on-error: true
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Write per-environment tfvars (dev/prod only, if configured)
        id: write-tfvars
        if: matrix.environment != 'shared' && steps.secrets-check.outputs.configured == 'true'
        working-directory: terraform/envs/${{ matrix.environment }}
        env:
          ENV_TFVARS: ${{ matrix.environment == 'dev' && secrets.DEV_TFVARS || secrets.PROD_TFVARS }}
        run: |
          if [ -n "$ENV_TFVARS" ]; then
            echo "$ENV_TFVARS" > ci.auto.tfvars
            echo "written=true" >> "$GITHUB_OUTPUT"
          else
            echo "written=false" >> "$GITHUB_OUTPUT"
            echo "No ${{ matrix.environment == 'dev' && 'DEV_TFVARS' || 'PROD_TFVARS' }} secret configured — terraform/envs/${{ matrix.environment }}'s init/plan steps below are skipped rather than run-and-fail (its rds_* variables, and for prod also ami_id/instance_type/alb_security_group_id/acm_certificate_arn, have no defaults)."
          fi

      # Both dev and prod now have required-with-no-default variables (see
      # terraform/envs/{dev,prod}/variables.tf's rds_* block, plus prod's
      # ami_id/instance_type/alb_security_group_id/acm_certificate_arn), so
      # without their respective *_TFVARS secret, `terraform plan` there can
      # only fail with "No value for required variable" — continue-on-error
      # would swallow that at the job level but still leave a failed red
      # step in the Actions UI, which is exactly what a "skipped no-op" is
      # meant to avoid. So dev/prod's init/plan only run once their tfvars
      # were actually written; shared is unaffected (it has no
      # required-with-no-default variables, so it needs no tfvars at all).
      - name: terraform init
        if: steps.secrets-check.outputs.configured == 'true' && (matrix.environment == 'shared' || steps.write-tfvars.outputs.written == 'true')
        continue-on-error: true
        working-directory: terraform/envs/${{ matrix.environment }}
        run: terraform init -input=false

      # -lock=false: this job is plan-only and never writes state, but
      # Terraform's native S3 locking (use_lockfile) still wants to PUT a
      # .tflock object even for a plan — which a deliberately read-only
      # plan role must not be allowed to do (observed as "Error acquiring
      # the state lock" / s3:PutObject AccessDenied on
      # envs/dev/terraform.tfstate.tflock once AWS_TERRAFORM_PLAN_ROLE_ARN
      # was configured). Skipping the lock is safe here precisely because
      # nothing in CI ever mutates state. The role's required (read-only)
      # permissions are documented in README's Terraform CI section.
      - name: terraform plan
        if: steps.secrets-check.outputs.configured == 'true' && (matrix.environment == 'shared' || steps.write-tfvars.outputs.written == 'true')
        continue-on-error: true
        working-directory: terraform/envs/${{ matrix.environment }}
        run: terraform plan -input=false -lock=false
