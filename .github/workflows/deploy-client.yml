name: Deploy client (S3 + CloudFront)

# Builds client/dist and publishes it to the environment's private S3 bucket
# behind CloudFront (terraform/modules/static-site, #28), into a directory
# named after the client version (vX.Y.Z). A version bump on main publishes
# to dev and prod. Run it by hand from the Actions tab to re-publish one
# environment (prod runs from main only).
# Uploading never changes what visitors get; deployed_version in version.tf does.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to publish to"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: deploy (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # A version bump publishes both buckets. A manual run publishes only the
      # chosen one. The matrix context is not available in a job-level if, and
      # the inputs context does not exist on push, so the list is chosen here.
      matrix:
        environment: ${{ github.event_name == 'push' && fromJSON('["dev", "prod"]') || fromJSON(format('["{0}"]', github.event.inputs.environment)) }}
    # Queue (never cancel) so two publishes to the same environment run in order.
    concurrency:
      group: deploy-client-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ matrix.environment }}
      # Each secret must be assigned on its own. GitHub Actions turns a
      # secret into an empty string when it is combined with && or ||, so
      # the publish failed even after the secrets were set.
      BUCKET_DEV: ${{ secrets.STATIC_SITE_BUCKET_DEV }}
      BUCKET_PROD: ${{ secrets.STATIC_SITE_BUCKET_PROD }}
      DISTRIBUTION_ID_DEV: ${{ secrets.STATIC_SITE_DISTRIBUTION_ID_DEV }}
      DISTRIBUTION_ID_PROD: ${{ secrets.STATIC_SITE_DISTRIBUTION_ID_PROD }}
    steps:
      - name: Check configuration
        run: |
          if [ "$TARGET_ENV" = "prod" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Production is published from main only (selected ref: ${{ github.ref_name }})."
            exit 1
          fi
          if [ "$TARGET_ENV" = "prod" ]; then
            bucket="$BUCKET_PROD"
            distribution_id="$DISTRIBUTION_ID_PROD"
          else
            bucket="$BUCKET_DEV"
            distribution_id="$DISTRIBUTION_ID_DEV"
          fi
          if [ -z "$bucket" ] || [ -z "$distribution_id" ]; then
            echo "::error::STATIC_SITE_BUCKET_* and STATIC_SITE_DISTRIBUTION_ID_* secrets for '$TARGET_ENV' are not configured (see README, Static client on S3 + CloudFront)."
            exit 1
          fi
          echo "BUCKET=$bucket" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$distribution_id" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      # Same tag the client image used to get: vX.Y.Z on main, the short
      # commit otherwise. Each release lives in its own directory, so an old
      # release stays in place until it is deleted by hand.
      - name: Compute client version directory
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "CLIENT_TAG=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          else
            echo "CLIENT_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Hashed bundle files first, so index.html never points at a file that
      # is not uploaded yet. Vite's file names carry a content hash, so they
      # can be cached for a year.
      - name: Upload hashed assets
        run: |
          aws s3 sync client/dist/assets/ "s3://$BUCKET/$CLIENT_TAG/assets/" --delete \
            --cache-control "public,max-age=31536000,immutable"

      # Everything else (index.html, ads.txt, icons) has a stable name, so
      # CloudFront must revalidate it. instance.json is written below.
      - name: Upload index.html and other root files
        run: |
          aws s3 sync client/dist/ "s3://$BUCKET/$CLIENT_TAG/" --delete \
            --exclude "assets/*" --exclude "instance.json" \
            --cache-control "no-cache"

      # The dev or prod banner file replaces the container bind mount the
      # old client service used.
      - name: Upload instance.json
        run: |
          if [ "$TARGET_ENV" = "prod" ]; then
            src=maintenance/ec2/config/instance.production.example.json
          else
            src=maintenance/ec2/config/instance.development.example.json
          fi
          aws s3 cp "$src" "s3://$BUCKET/$CLIENT_TAG/instance.json" \
            --cache-control "no-cache" --content-type "application/json"

      # CloudFront serves the directory named by the distribution's origin
      # path (deployed_version in terraform/envs/{dev,prod}/version.tf), so
      # uploading does not change what visitors get. Invalidating the
      # stable-name files covers re-publishing the version that is already live.
      - name: Invalidate index.html, ads.txt, and instance.json
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/ads.txt" "/instance.json"

      - name: Next step
        run: |
          echo "Uploaded to s3://$BUCKET/$CLIENT_TAG/."
          echo "To serve it, set deployed_version = \"$CLIENT_TAG\" in terraform/envs/$TARGET_ENV/version.tf and apply."
          echo "### Client uploaded" >> "$GITHUB_STEP_SUMMARY"
          echo "Directory: \`$CLIENT_TAG\`. Set \`deployed_version = \"$CLIENT_TAG\"\` in terraform/envs/$TARGET_ENV/version.tf and apply. That also selects the server image." >> "$GITHUB_STEP_SUMMARY"
