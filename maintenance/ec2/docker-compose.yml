# Single EC2: server only. The client is static files on S3 and CloudFront.
# Path routing and TLS are handled by AWS ALB and CloudFront.
# PostgreSQL runs outside EC2 (e.g. AWS RDS).
# Images are pulled from AWS ECR (build locally with maintenance/ecr/build-and-push.sh).
#
# Host port 8081 is the server (API / WebSocket paths) for the ALB target group.
#
# From repo root:
#   cp maintenance/ec2/.env.example maintenance/ec2/.env
#   cp maintenance/ec2/config/config.example.json maintenance/ec2/config/config.json
#   cp maintenance/ec2/config/instance.production.example.json maintenance/ec2/config/instance.json
#   # on dev EC2 use instance.development.example.json instead
#   bash maintenance/ec2/deploy.sh

services:
  server:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/e2eetext-server:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL}
      CONFIG_PATH: /config/config.json
      # CloudWatch metrics (#37): publishing is on only when the namespace is set.
      AWS_REGION: ${AWS_REGION}
      METRICS_CLOUDWATCH_NAMESPACE: ${METRICS_CLOUDWATCH_NAMESPACE:-}
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-}
    volumes:
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s
