# EC2 #1 (backend): server only. PostgreSQL runs outside EC2 (e.g. AWS RDS).
# Images from AWS ECR.

services:
  server:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/e2eetext-server:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL}
      CONFIG_PATH: /config/config.json
    volumes:
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s
