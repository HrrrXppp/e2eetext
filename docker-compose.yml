services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: e2eetext-server
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_URL: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
      CONFIG_PATH: /config/config.json
    volumes:
      - ./server/config.json:/config/config.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: e2eetext-client
    ports:
      - "5173:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
